<script>
    // In-memory data store for sections grouped by Grade
    let dashboardData = {
        sections: {
            "1": [
                { name: "MASIPAG", adviser: "RUTH ANN B. MARTIN" }
            ]
        }
    };

    function syncCredentials() {
        // Independent local hook for Input Data tab
    }

    function addDashboardSection() {
        const grade = document.getElementById('db-grade').value;
        const input = document.getElementById('db-new-section-input');
        const adviserInput = document.getElementById('db-adviser');
        
        let sectionName = input.value.trim().toUpperCase();
        sectionName = sectionName.replace(/^SECTION\s+/i, '');

        const adviserName = adviserInput.value.trim().toUpperCase();

        if (!sectionName) {
            alert('Please enter a section name.');
            return;
        }

        if (!dashboardData.sections[grade]) {
            dashboardData.sections[grade] = [];
        }

        dashboardData.sections[grade].push({ name: sectionName, adviser: adviserName });
        
        input.value = '';

        document.getElementById('db-section-grade-filter').value = grade;
        renderSections();
    }

    function removeSection(grade, index) {
        if (dashboardData.sections[grade]) {
            dashboardData.sections[grade].splice(index, 1);
            renderSections();
        }
    }

    function renderSections() {
        const filterGrade = document.getElementById('db-section-grade-filter').value;
        document.getElementById('db-managing-grade-label').textContent = `Grade ${filterGrade}`;
        
        const container = document.getElementById('dashboard-sections-container');
        container.innerHTML = '';

        const list = dashboardData.sections[filterGrade] || [];

        if (list.length === 0) {
            container.innerHTML = `<span class="text-xs text-slate-400 italic">No sections added for Grade ${filterGrade}.</span>`;
            return;
        }

        list.forEach((sec, idx) => {
            const badge = document.createElement('div');
            badge.className = 'inline-flex items-center bg-slate-100 border border-slate-300 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm gap-2';
            
            badge.innerHTML = `
                <span class="text-blue-900 font-extrabold">${sec.name}</span>
                ${sec.adviser ? `<span class="text-slate-500 font-normal">(${sec.adviser})</span>` : ''}
                <button onclick="removeSection('${filterGrade}', ${idx})" class="text-slate-400 hover:text-red-600 transition font-black ml-1">&times;</button>
            `;
            container.appendChild(badge);
        });
    }

    function saveDashboardCredentials() {
        alert('Basic Information and Sections saved successfully!');
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderSections();
    });
</script>
